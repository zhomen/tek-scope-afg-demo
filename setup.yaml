# setup.yaml -- generated by /mhs-setup
#
# Combined setup metadata and driver configuration.
# Top-level keys (device_id, device_type, state, procedures) are consumed
# by the SDK's declarative driver synthesis (the from-yaml model in the
# spec's application API).
#
# The "rig:" section name is a frozen compatibility contract (existing
# user files and launch.py read it) -- do not rename the key. It and
# "devices:" carry interview metadata for the review and re-entry
# path. "backend:" is informational; storage is selected by launch.py's
# --storage flag (per-mode defaults), never by an environment variable.

rig:
  name: tek-scope-afg-demo
  description: "Simulated Tektronix AFG3000 driving a simulated MSO 4/5/6 scope on CH1; demo of MHS control for a meeting with Madhu"
  backend: inmem
  topology: peripherals
  mode: simulated
  profile: buffer
device_id: "tek-scope-afg-demo"
device_type: "simulated_bench"

devices:
  - id: afg
    type: unknown  # function generator; not in known-devices.yaml
    model: "AFG3000 series (generic, 25 MHz limit)"
    model_source: stated_by_user
    connection:
      method: simulated
      address: ""
    notes: "Real unit is reached over the network (stated_by_user). Model unknown, so simulated with the most conservative 25 MHz limit. Only CH1 is modeled. Operator confirmed no interlocks and nothing else to note."
  - id: scope
    type: unknown  # oscilloscope; not in known-devices.yaml
    model: "MSO 4/5/6 Series"
    model_source: stated_by_user
    connection:
      method: simulated
      address: ""
    notes: "Real unit is reached over the network (stated_by_user). CH1 sees the AFG CH1 output (simulated, assumes 50 ohm termination). Readings: measured frequency, measured Vpp, 1000-point trace. Operator confirmed no interlocks and nothing else to note."

state:
# ---- AFG CH1 controls ----
  - name: "afg/output_enable"
    kind: "control"
    chain:
      - format: "io.mhs/safety_int"
        range: [0, 1]
        safe: [0, 1]
    unit: ""
    on_disconnect: HOLD  # operator chose "keep as-is" explicitly
    getter: "afg.output_enable"
    setter: "afg.output_enable"
    description: "AFG CH1 output: 0 = off, 1 = on"

  - name: "afg/frequency"
    kind: "control"
    chain:
      - format: "io.mhs/safety_float"
        range: [0.001, 25000000.0]
        safe: [1.0, 25000000.0]
        estop_value: 1.0  # estop matches the SAFE disconnect policy
    unit: "Hz"
    on_disconnect: SAFE  # goes to 1 Hz
    getter: "afg.frequency"
    setter: "afg.frequency"
    description: "AFG CH1 frequency"

  - name: "afg/amplitude"
    kind: "control"
    chain:
      - format: "io.mhs/safety_float"
        range: [0.01, 10.0]
        safe: [0.01, 5.0]
        estop_value: 0.01  # estop matches the SAFE disconnect policy
    unit: "Vpp"
    on_disconnect: SAFE  # drops to 0.01 Vpp
    getter: "afg.amplitude"
    setter: "afg.amplitude"
    description: "AFG CH1 amplitude into 50 ohm"

  - name: "afg/waveform"
    kind: "control"
    chain:
      - format: "io.mhs/safety_int"
        range: [0, 2]
        safe: [0, 2]
        estop_value: 0  # estop matches the SAFE disconnect policy (sine)
    unit: ""
    on_disconnect: SAFE  # returns to 0 = sine
    getter: "afg.waveform"
    setter: "afg.waveform"
    description: "AFG CH1 shape: 0 = sine, 1 = square, 2 = ramp"

# ---- Scope CH1 controls ----
  - name: "scope/ch1_scale"
    kind: "control"
    chain:
      - format: "io.mhs/safety_float"
        range: [0.0005, 10.0]
        safe: [0.01, 5.0]
    unit: "V/div"
    on_disconnect: HOLD  # operator chose "keep" explicitly
    getter: "scope.ch1_scale"
    setter: "scope.ch1_scale"
    description: "Scope CH1 vertical scale"

  - name: "scope/run"
    kind: "control"
    chain:
      - format: "io.mhs/safety_int"
        range: [0, 1]
        safe: [0, 1]
        estop_value: 0  # estop matches the ZERO disconnect policy
    unit: ""
    on_disconnect: ZERO  # stops acquiring
    getter: "scope.run"
    setter: "scope.run"
    description: "Scope acquisition: 0 = stopped, 1 = running"

# ---- Scope readings ----
  - name: "scope/meas_frequency"
    kind: "sensor"
    chain:
      - format: "io.mhs/float"
    unit: "Hz"
    getter: "scope.meas_frequency"
    description: "Measured CH1 frequency (0 when no signal)"

  - name: "scope/meas_vpp"
    kind: "sensor"
    chain:
      - format: "io.mhs/float"
    unit: "V"
    getter: "scope.meas_vpp"
    description: "Measured CH1 peak-to-peak voltage (clips at the screen edge)"

  - name: "scope/ch1_trace"
    kind: "sensor"
    chain:
      - format: "io.mhs/numpy"
        max_size: 16384  # real encoded 1000-point sample measured at 8464 bytes; ~2x headroom
    unit: "V"
    getter: "scope.ch1_trace"
    description: "CH1 trace, 1000 points spanning about 5 signal cycles"

procedures: []
